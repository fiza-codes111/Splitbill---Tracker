<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SplitEase - Split Bill Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-4 md:p-8 font-sans">
  <div class="max-w-4xl mx-auto space-y-6">
    <!-- Header -->
    <header class="flex flex-col sm:flex-row sm:items-center sm:justify-between bg-white p-6 rounded-2xl shadow-sm border border-slate-200 gap-4">
      <div>
        <h1 class="text-2xl font-bold text-indigo-600">SplitEase</h1>
        <p class="text-sm text-slate-500">Simple group expense & bill splitter</p>
      </div>
      <div class="flex items-center gap-3">
        <label for="currency" class="text-sm font-medium text-slate-600">Currency:</label>
        <select id="currency" class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="₹">₹ (INR)</option>
          <option value="$">$ (USD)</option>
          <option value="€">€ (EUR)</option>
          <option value="£">£ (GBP)</option>
        </select>
        <button id="resetBtn" class="text-sm text-rose-600 hover:bg-rose-50 px-3 py-1.5 rounded-lg border border-rose-200 transition">
          Reset All
        </button>
      </div>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Left Column: People & Add Expense -->
      <div class="space-y-6">
        <!-- Manage Participants -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
          <h2 class="text-lg font-semibold mb-3">1. Group Members</h2>
          <form id="personForm" class="flex gap-2 mb-4">
            <input type="text" id="personName" placeholder="Enter name (e.g., Alex)" required
              class="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            <button type="submit"
              class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
              Add
            </button>
          </form>
          <div id="peopleList" class="flex flex-wrap gap-2"></div>
        </section>

        <!-- Add Expense -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
          <h2 class="text-lg font-semibold mb-3">2. Add an Expense</h2>
          <form id="expenseForm" class="space-y-4">
            <div>
              <label class="block text-xs font-medium text-slate-500 uppercase mb-1">Description</label>
              <input type="text" id="expDesc" placeholder="Dinner, Taxi, Hotel..." required
                class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-medium text-slate-500 uppercase mb-1">Amount</label>
                <input type="number" id="expAmount" step="0.01" min="0.01" placeholder="0.00" required
                  class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-500 uppercase mb-1">Paid By</label>
                <select id="expPaidBy" required
                  class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </select>
              </div>
            </div>

            <div>
              <div class="flex justify-between items-center mb-1">
                <label class="block text-xs font-medium text-slate-500 uppercase">Split Equally Between</label>
                <button type="button" id="selectAllBtn" class="text-xs text-indigo-600 hover:underline">Select All</button>
              </div>
              <div id="splitCheckboxes" class="grid grid-cols-2 gap-2 p-3 bg-slate-50 rounded-lg border border-slate-200 max-h-40 overflow-y-auto"></div>
            </div>

            <button type="submit"
              class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-lg text-sm font-semibold transition">
              + Add Expense
            </button>
          </form>
        </section>
      </div>

      <!-- Right Column: Summary, Settlements & Expense Log -->
      <div class="space-y-6">
        <!-- Total & Settlements -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
          <div class="flex justify-between items-baseline border-b border-slate-100 pb-4 mb-4">
            <h2 class="text-lg font-semibold">3. Who Pays Whom</h2>
            <div class="text-right">
              <span class="text-xs text-slate-400 block">Total Group Spend</span>
              <span id="totalSpend" class="text-xl font-bold text-slate-800">₹0.00</span>
            </div>
          </div>

          <!-- Simplified Transactions -->
          <div id="settlementsList" class="space-y-2 mb-6"></div>

          <!-- Individual Net Balances -->
          <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Net Balances</h3>
          <div id="balancesList" class="space-y-1.5 text-sm"></div>
        </section>

        <!-- Expense History -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
          <h2 class="text-lg font-semibold mb-3">Expense History</h2>
          <div id="expensesList" class="space-y-3 max-h-80 overflow-y-auto pr-1"></div>
        </section>
      </div>
    </div>
  </div>

  <script>
    // State loaded from localStorage or defaults
    let state = JSON.parse(localStorage.getItem('splitEaseState')) || {
      currency: '₹',
      people: ['Alice', 'Bob', 'Charlie'],
      expenses: []
    };

    const saveState = () => {
      localStorage.setItem('splitEaseState', JSON.stringify(state));
      render();
    };

    const formatMoney = (amount) => `${state.currency}${Number(amount).toFixed(2)}`;

    // DOM Elements
    const currencyEl = document.getElementById('currency');
    const personForm = document.getElementById('personForm');
    const personNameEl = document.getElementById('personName');
    const peopleListEl = document.getElementById('peopleList');
    const expenseForm = document.getElementById('expenseForm');
    const expPaidByEl = document.getElementById('expPaidBy');
    const splitCheckboxesEl = document.getElementById('splitCheckboxes');
    const selectAllBtn = document.getElementById('selectAllBtn');
    const totalSpendEl = document.getElementById('totalSpend');
    const settlementsListEl = document.getElementById('settlementsList');
    const balancesListEl = document.getElementById('balancesList');
    const expensesListEl = document.getElementById('expensesList');
    const resetBtn = document.getElementById('resetBtn');

    // Currency change
    currencyEl.value = state.currency;
    currencyEl.addEventListener('change', (e) => {
      state.currency = e.target.value;
      saveState();
    });

    // Add Person
    personForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = personNameEl.value.trim();
      if (!name) return;
      if (state.people.some(p => p.toLowerCase() === name.to
